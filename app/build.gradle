apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: 'kotlin-kapt'

// The telemetry token is not in git and is never typed on the phone: it is read at configure time
// from the same file the server itself reads. A checkout on another machine simply builds with an
// empty token, and the uploader then refuses to send.
def syncTokenFile = new File("/DATA/AppData/lifeup-sync/token")
def syncToken = syncTokenFile.exists() ? syncTokenFile.text.trim() : ""

android {
    compileSdk 34
    defaultConfig {
        // fork identity: installs beside upstream Open TimeLimit, own update channel
        applicationId "t1191.limited.com"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 237
        versionName "7.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        kapt {
            arguments {
                arg("room.schemaLocation", "$projectDir/schemas".toString())
            }
            javacOptions {
                option("-Xmaxerrs", 500)
            }
        }

        // Same host and the same tailnet fallback the LifeUp patch uses, so one change of address
        // never has to be made twice.
        buildConfigField 'String', 'SYNC_TOKEN', '"' + syncToken + '"'
        buildConfigField 'String', 'SYNC_BASE', '"https://lifeup.tao.ai.vn"'
        buildConfigField 'String', 'SYNC_BASE_FALLBACK', '"http://100.82.112.63:8090"'

        buildConfigField 'String', 'backdoorPublicKey', '""'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        // AGP 8 disables AIDL by default; the Shizuku UserService needs it
        aidl true
    }

    lint {
        disable 'GoogleAppIndexingWarning'
        baseline file("lint-baseline.xml")
        abortOnError false
        textReport true
        textOutput file("lint-report.txt")
    }

    dataBinding {
        enabled = true
    }

    buildTypes {
        debug {
            multiDexEnabled true
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        // What actually runs on the phone: not debuggable, but shareable with the debug install.
        //
        // The debug build left `adb shell run-as` open, which meant the hard lock could be undone by
        // editing the database or flipping the agent's cached switch -- no tapping required. A real
        // release keystore would force an uninstall (different certificate) and take the categories,
        // rules and agent state with it, so this reuses the debug certificate on purpose: `install -r`
        // upgrades in place, BuildConfig.DEBUG is false and run-as is closed.
        //
        // minify stays off for now. Turning R8 on is a separate pass with its own testing, not a
        // side effect of making the build non-debuggable.
        releaseSigned {
            initWith release
            minifyEnabled false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
    namespace 'io.timelimit.android'
}

dependencies {
    def nav_version = "2.7.7"
    def room_version = "2.6.1"
    def paging_version = "3.3.1"
    def lifecycle_version = "2.6.2" // Updated from lifecycle-extensions
    def shizuku_version = "13.1.5"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0' // Upgraded due to SDK 21
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation "com.google.android.material:material:1.13.0"
    implementation 'androidx.fragment:fragment-ktx:1.8.2' // Upgraded due to SDK 21

    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui:$nav_version"
    
    // lifecycle-extensions is deprecated. Replaced with livedata, viewmodel and runtime.
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // Shizuku API Integration
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    implementation "androidx.paging:paging-runtime:$paging_version"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    implementation 'androidx.biometric:biometric:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.jakewharton.threetenabp:threetenabp:1.1.0'

    implementation 'org.mindrot:jbcrypt:0.4'

    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    implementation 'com.squareup.okio:okio:3.6.0'

    implementation 'org.whispersystems:curve25519-java:0.5.0'

    implementation 'com.google.zxing:core:3.3.3'
}

tasks.register("fixAttr2") {
    doLast {
        def layoutsDir = file("src/main/res/layout")
        layoutsDir.eachFileRecurse { f ->
            if (f.name.endsWith(".xml")) {
                def content = f.text
                if (content.contains('=""?attr')) {
                    content = content.replaceAll('=""\\?attr', '="?attr')
                    f.text = content
                    println "Fixed \${f.name}"
                }
            }
        }
    }
}
